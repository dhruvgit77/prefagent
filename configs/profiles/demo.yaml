# Demo profile: a one-day, end-to-end run of the REAL pipeline at reduced scale.
#   python scripts/02_label.py run --profile demo
# Same code, prompts, judges and DPO loss as the full study; only sizes shrink.
# Results from this profile are a pilot, not the paper's numbers.

policies:
  # 0.5B so training runs on a laptop (Apple MPS) in under an hour per model.
  # Same family as the primary model; in the full study it is the "smaller" point.
  primary: Qwen/Qwen2.5-0.5B-Instruct
  generalization: []

conditions:
  _replace: true
  base:        {train: false}
  human:       {candidates: hh_rlhf,       labels: human}
  multi_panel: {candidates: multi_persona, labels: panel}
  # Same panel labels, disagreement-aware loss: isolates the method (RQ4).
  multi_panel_da: {candidates: multi_persona, labels: panel, dpo: disagreement_aware}
  # Controls built from the same candidates with no extra API calls.
  length:      {candidates: multi_persona, labels: longer}
  random:      {candidates: multi_persona, labels: random}

data_sizes:
  # 150, not 200: the generator also holds a panel seat, so it makes 4 + 2 = 6 calls per
  # prompt; 150 × 6 = 900 stays under its 1,000 requests/day with room for retries.
  main: 150
  scaling: []
  scaling_conditions: []

splits:
  # Only these two prompt pools are touched; label-agreement / GSM8K checks are skipped.
  dev_pairs: 0
  label_agreement_pairs: 0
  gsm8k_label_problems: 0

gsm8k:
  enabled: false

seeds:
  train: [0]

training:
  # ~150 pairs / effective batch 8 ≈ 19 steps per epoch, ~38 in total. The full study's
  # 5e-6 with batch 16 would give ~19 tiny steps and barely move a LoRA adapter, so the
  # demo uses a higher LR. Identical for both conditions, so the comparison stays fair.
  # Batch 1 × 8 accumulation (same effective batch of 8). On Apple MPS, batch 2 with
  # long agent answers padded together gave a nonsense loss (−368, −675 in two runs of
  # the same 8 pairs; correct is ≈0.693 at step 1) and ran 15× slower under memory
  # pressure. Batch 1 gave the correct loss in 42 s. Found 2026-10-28.
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 2.0e-5

checkpointing:
  save_steps: 25

diagnostics:
  eval_steps: null          # no dev split in the demo

win_rate:
  n_prompts: 100            # first 100 of the 500 held-out eval prompts
  # Two independent jurors, neither used for labelling. Cohere's trial key allows 1,000
  # calls/month; 4 comparisons × 100 prompts × 2 orders use ~800 of them.
  jury: [gemini_lite, command]
  comparisons:
    - [human, base]
    - [multi_panel, base]
    - [multi_panel, human]
    - [multi_panel_da, multi_panel]
