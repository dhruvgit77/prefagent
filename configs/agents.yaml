# Layer A: the agent pipeline that turns a prompt into a (chosen, rejected) pair.
# It never touches model weights — it only calls LLM APIs.
#
# Model IDs below are examples: free-tier catalogues change often, so check each
# provider's model list and edit the IDs. Keep the `family` fields accurate —
# the code uses them to enforce the judge-independence rule (see eval.yaml).

providers:
  # All five expose an OpenAI-compatible Chat Completions endpoint, so a single
  # client handles all of them; only base_url and the key change.
  groq:
    base_url: https://api.groq.com/openai/v1
    api_key_env: GROQ_API_KEY
    rpm: 30                 # requests/minute we allow ourselves; set ≤ your console limit
  gemini:
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    api_key_env: GEMINI_API_KEY
    rpm: 10
  mistral:
    base_url: https://api.mistral.ai/v1
    api_key_env: MISTRAL_API_KEY
    rpm: 20
  cohere:
    base_url: https://api.cohere.ai/compatibility/v1
    api_key_env: COHERE_API_KEY
    rpm: 18                 # trial limit is 20/minute
  ollama:
    # Local fallback: no key, no rate limit, but slow on a laptop CPU.
    base_url: http://localhost:11434/v1
    api_key_env: null
    rpm: 1000

llms:
  # name -> provider, model id, family, and the model's free-tier limits.
  # Checked against the live Groq / Gemini catalogues on 2026-10-07 (Groq returns its limits
  # in x-ratelimit-* response headers). Catalogues change: re-check before a long run.
  #   rpd = requests/day (used by `02_label.py budget`), tpm = tokens/minute (the client
  #   paces itself to stay under it — at 8k TPM, tokens, not requests, are the bottleneck).
  # gpt-oss are reasoning models: hidden reasoning tokens count against max_tokens, so
  # "low" effort keeps judge calls fast and leaves room for the JSON verdict.
  gptoss120b:   {provider: groq,   id: openai/gpt-oss-120b,    family: gpt-oss,
                 extra: {reasoning_effort: low},  rpd: 1000, tpm: 8000}
  gptoss20b:    {provider: groq,   id: openai/gpt-oss-20b,     family: gpt-oss,
                 extra: {reasoning_effort: low},  rpd: 1000, tpm: 8000}
  # Thinking disabled: we want the assistant's answer, not a reasoning trace.
  # Also capped at 1,000 OUTPUT tokens/minute (otpm), found via a live 429 on 2026-10-07.
  qwen3_27b:    {provider: groq,   id: qwen/qwen3.8-27b,       family: qwen,
                 extra: {reasoning_effort: none}, rpd: 1000, tpm: 8000, otpm: 1000}
  gemini_flash: {provider: gemini, id: gemini-3.5-flash,       family: gemini, rpd: 250}
  gemini_lite:  {provider: gemini, id: gemini-3.5-flash-lite,  family: gemini, rpd: 1000}
  # Cohere trial keys: 1,000 calls per MONTH and 20/minute (x-endpoint-monthly-call-limit).
  command:      {provider: cohere,  id: command-a-03-2025,     family: cohere,  rpd: 1000}
  # No key yet; kept so Mistral can be added as a third juror later.
  mistral:      {provider: mistral, id: mistral-small-latest,  family: mistral, rpd: 1000}

# ---------------------------------------------------------------------------
# Candidate generation (factor 1 of the 2×2: DIVERSITY)
# ---------------------------------------------------------------------------
generation:
  # gpt-oss-20b, not qwen3: Qwen's 1k output-tokens/minute cap makes it ~5× slower to
  # generate with. gpt-oss-20b also sits on the panel; within a pair that is neutral,
  # since every candidate it judges comes from it.
  model: gptoss20b
  # Four candidates per prompt in BOTH levels of the factor, so the only thing
  # that differs is where the diversity comes from (personas vs sampling noise).
  n_candidates: 4
  # Same temperature for both levels, for the same reason. 0.8 gives varied but
  # coherent answers; at 1.0+ a 70B model starts producing noticeably worse text,
  # which would make "rejected" trivially bad and the pairs uninformative.
  temperature: 0.8
  top_p: 0.95
  # Room for the generator's hidden reasoning tokens (gpt-oss counts them against this
  # cap). At 450, 16% of answers were cut off in the first demo attempt, spread across all
  # personas; answers themselves stay short through length_instruction below.
  max_tokens: 900
  # Appended to EVERY persona's system prompt (both factor levels), so length guidance
  # never differs between conditions. Without it the "step by step" persona overran
  # max_tokens on 3 of 4 answers in the pilot; truncated answers are unusable as data.
  length_instruction: "Keep your answer under 200 words."

  single_persona:
    - "You are a helpful assistant. Answer the user's request."
  multi_persona:
    - "You are a helpful assistant. Answer directly and concisely."
    - "You are a helpful assistant. Answer thoroughly, reasoning step by step."
    - "You are a helpful assistant and a domain expert. Prioritise technical precision."
    - "You are a helpful assistant and a careful sceptic. Flag any uncertainty explicitly."
  # Every persona starts with the same helpful-assistant line so personas vary style
  # and depth, not willingness to help — otherwise "pick the helpful one" is trivial.

# ---------------------------------------------------------------------------
# Judging (factor 2 of the 2×2: DELIBERATION) — compute-matched at 6 calls/prompt
# ---------------------------------------------------------------------------
judging:
  rubric:
    criteria: [helpfulness, correctness, harmlessness]
    scale: [1, 5]
    # Stated to counter the well-known verbosity bias of LLM judges. We still
    # MEASURE length bias afterwards; this just avoids encouraging it.
    instructions: >-
      Judge substance, not length or style. A shorter answer that fully solves the
      request is better than a longer one that pads. Refusing a harmless request is
      unhelpful; complying with a harmful one is harmful.
  # Candidates are shown in a fresh random order on every call (the permutation is
  # logged) so position bias averages out instead of favouring candidate #1.
  shuffle_candidates: true
  temperature: 0.7          # >0 so repeated single-judge samples actually differ
  max_tokens: 800
  response_format: json     # the verdict is validated with pydantic; retried on failure
  max_parse_retries: 3
  # How final verdicts become one label — IDENTICAL for both judging levels, so the
  # aggregation rule is not a hidden second difference between them. Each verdict's
  # overall score for a candidate = mean over criteria; chosen = highest mean over
  # final verdicts, rejected = lowest; exact ties broken by a seeded coin flip (never
  # by candidate order, which would favour persona #1).
  aggregate: mean_score

  single_judge:
    model: gptoss120b
    # Self-consistency: 6 independent samples, all treated as final verdicts.
    # 6 = the panel's call count, so any panel gain is not just "more compute".
    samples: 6

  panel:
    # Two families (gpt-oss ×2, qwen): the only free Groq models on 2026-10-07.
    judges: [gptoss120b, gptoss20b, qwen3_27b]
    # Round 1: each judge scores independently. Round 2: each judge sees the others'
    # round-1 verdicts and rationales and may revise (Du et al. 2023 style debate).
    # 3 judges × 2 rounds = 6 calls — matched to single_judge.samples.
    # Only round-2 verdicts are final (3 verdicts); round 1 is the debate input.
    rounds: 2
    # Optional ablation from the original design: in round 2 the first judge is told to
    # make the strongest case for the response the round-1 majority rated lowest.
    # It still returns a normal verdict — its argument is never added as a candidate.
    devils_advocate: false

  # Stored per pair and used by disagreement-aware DPO: the fraction of final
  # judge verdicts that agree on the chosen-over-rejected ordering (1/3 … 1).
  record_agreement: true

cache:
  # Every request is hashed (model, messages, params, sample index) and its response
  # stored. Re-running never re-spends free-tier quota, and the exact raw outputs
  # behind the paper's dataset are preserved.
  enabled: true
  backend: sqlite

retry:
  max_attempts: 6
  initial_wait_s: 2
  max_wait_s: 60            # exponential backoff with jitter on 429 / 5xx
